name: Build Fabric mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Gradle Wrapper when missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x ./gradlew ]]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
            chmod +x ./gradlew
          fi

      - name: Build mod
        run: ./gradlew --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: winter-pulse-visuals
          path: build/libs/*.jar
          if-no-files-found: error
