name: Build Fabric mod

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Install Gradle Wrapper when missing
        shell: bash
        run: |
          if [[ ! -f ./gradlew ]]; then
            gradle wrapper --gradle-version 8.10 --distribution-type bin
          fi
          chmod +x ./gradlew

      - name: Build mod and validate Java sources
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: winter-pulse-visuals
          path: build/libs/*.jar
          if-no-files-found: error
